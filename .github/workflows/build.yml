name: Build B Agent APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bagent-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bagent.keystore" \
            -alias bagent \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bagentpass -keypass bagentpass \
            -dname "CN=B Agent, OU=Mobile, O=BAgent, L=NA, ST=NA, C=US"

      - name: Assemble release APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease \
            -PBA_KEYSTORE_PATH="$RUNNER_TEMP/bagent.keystore" \
            -PBA_KEYSTORE_PASS=bagentpass \
            -PBA_KEY_ALIAS=bagent \
            -PBA_KEY_PASS=bagentpass

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/B-Agent-release.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Agent-release-apk
          path: dist/B-Agent-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: B Agent — latest build
          make_latest: true
          body: |
            Automated build from commit `${{ github.sha }}`.

            Install `B-Agent-release.apk` on Android 8.0+ (minSdk 26).
          files: dist/B-Agent-release.apk
